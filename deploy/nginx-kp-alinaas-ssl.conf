# Сайт на поддомене КП с HTTPS и HTTP/2. Сертификат выпускает certbot (certonly),
# конфиг целиком наш, certbot его не правит.

server {
    listen 80;
    listen [::]:80;
    server_name KP_DOMAIN SSLIP_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/kp-alinaas; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name KP_DOMAIN SSLIP_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/SSLIP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SSLIP_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/kp-alinaas.conf;
}
