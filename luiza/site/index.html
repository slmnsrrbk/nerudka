<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Шаблон кейса Luiza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Unbounded:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Прототип шаблона страницы поста (Tilda CMS, Zero Block).
     Элементы с data-field связаны с полями потока и прячутся, если поле пустое
     (в Тильде: видимость «Указано»). Названия пунктов аккордеона статичные. -->

<div class="cursor" aria-hidden="true"><span>Смотреть</span></div>

<header class="nav">
  <a class="logo" href="#top" aria-label="Luiza Event"><img src="logo.svg" width="204" height="27" alt="Luiza Event"></a>
  <nav class="menu">
    <a href="#" class="txt2">Портфолио</a>
    <a href="#" class="txt2">О нас</a>
    <a href="#" class="txt2">Новости</a>
    <a href="#contact" class="txt2">Контакты</a>
  </nav>
  <div class="nav__right">
    <a class="nav__phone" href="tel:+79297254467">+7 (929) 725-44-67</a>
    <a class="nav__cta" href="#contact">Записаться на встречу</a>
    <button class="nav__burger" type="button" aria-label="Меню"><span></span><span></span></button>
  </div>
</header>

<main id="top">

  <!-- 1. Первый экран: композиция как на текущем сайте -->
  <section class="hero">
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="hero__line"></div>
    <div class="hero__grid">
      <div class="hero__meta">
        <span class="dot"></span>
        <span data-field="year" data-bind="year"></span>
      </div>
      <div class="hero__text">
        <h1 class="hero__title">
          <span data-field="title" data-bind="title"></span>
          <span class="hero__project" data-field="project_name" data-bind="project_name"></span>
        </h1>
        <p class="hero__lead" data-field="lead" data-bind="lead"></p>
      </div>
    </div>
    <figure class="hero__media" data-field="hero_img" data-view>
      <img data-bind="hero_img" alt="">
    </figure>
  </section>

  <!-- 2. О проекте: заголовок и аккордеоны слева, фото раздела справа -->
  <section class="about">
    <div class="about__left">
      <h2 class="about__title">О проекте</h2>
      <div class="acc">
        <div class="acc__item is-open" data-field="concept_text" data-photo="concept_ph1">
          <button class="acc__head" type="button" aria-expanded="true"><span>Концепция</span><i></i></button>
          <div class="acc__body"><div><p data-bind="concept_text"></p></div></div>
        </div>
        <div class="acc__item" data-field="tasks_text" data-photo="tasks_ph1">
          <button class="acc__head" type="button" aria-expanded="false"><span>Задачи</span><i></i></button>
          <div class="acc__body"><div><p data-bind="tasks_text"></p></div></div>
        </div>
        <div class="acc__item" data-field="decor_text" data-photo="decor_ph1">
          <button class="acc__head" type="button" aria-expanded="false"><span>Декор</span><i></i></button>
          <div class="acc__body"><div><p data-bind="decor_text"></p></div></div>
        </div>
        <div class="acc__item" data-field="extra_text" data-photo="extra_img">
          <button class="acc__head" type="button" aria-expanded="false"><span>Что было ещё</span><i></i></button>
          <div class="acc__body"><div><ul class="acc__list" data-bind="extra_text" data-list></ul></div></div>
        </div>
      </div>
    </div>
    <div class="about__right">
      <figure class="about__photo" data-view><img alt=""></figure>
    </div>
  </section>

  <!-- 3. Фото плиткой разных размеров -->
  <section class="tiles" data-field="gallery" data-bind="gallery"></section>

  <!-- 4. Следующий проект: плитка потока, лимит 1 -->
  <section class="next" data-section="next">
    <a class="next__card" href="#" data-view>
      <img data-bind="next.card_img" alt="">
      <div class="next__body">
        <span class="pill">Следующий проект</span>
        <span class="next__title" data-bind="next.title"></span>
        <span class="next__arrow" aria-hidden="true">→</span>
      </div>
    </a>
  </section>
</main>

<!-- 5. Подвал с формой: общий для всех постов -->
<footer class="footer" id="contact">
  <div class="blob blob--a"></div><div class="blob blob--b"></div>
  <div class="footer__inner">
    <h2 class="footer__title">Остались вопросы?</h2>
    <p class="footer__sub">Заполните форму, мы с вами свяжемся</p>
    <form class="form" onsubmit="event.preventDefault(); this.classList.add('is-sent')">
      <input id="f-name" type="text" placeholder="Имя" required>
      <input id="f-phone" type="tel" placeholder="Телефон" required>
      <button type="submit" class="btn">Отправить</button>
      <p class="form__ok">Спасибо, мы свяжемся с вами</p>
    </form>
    <div class="footer__bottom">
      <span>Петербургская улица, 64, Казань</span>
      <span>+7 (929) 725-44-67</span>
    </div>
  </div>
</footer>

<!-- Просмотр фото на весь экран -->
<div class="lb" hidden role="dialog" aria-modal="true" aria-label="Просмотр фото">
  <div class="lb__stage"><img class="lb__img" alt=""></div>
  <button class="lb__btn lb__close" type="button" aria-label="Закрыть"></button>
  <button class="lb__btn lb__prev" type="button" aria-label="Предыдущее фото"></button>
  <button class="lb__btn lb__next" type="button" aria-label="Следующее фото"></button>
  <div class="lb__count"></div>
</div>

<script src="case.js"></script>
<script src="app.js"></script>
</body>
</html>
