# Общие настройки сайта на kp.slmn2.ru: корень, сжатие, кэш, заголовки.
# Подключается и в HTTP-, и в HTTPS-блок (snippets/kp-alinaas.conf на сервере).
# Раскладка: / сайт mrs.alinaas, /kp/ коммерческое предложение, /prototype/ прототип.

root /var/www/kp-alinaas;
index index.html;
charset utf-8;

# Сжатие текста: HTML, стили, скрипты, JSON, SVG.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

# Служебные файлы (.htaccess и т.п.) не отдаём, certbot-проверку пропускаем.
location ~ /\.(?!well-known) { deny all; }
location = /_headers { deny all; }

# Стили и скрипты сайта подключены с ?v=N, поэтому их можно кэшировать навсегда.
location ~* ^/(?:[^/]+\.(?:css|js)|vendor/.+)$ {
    include snippets/kp-alinaas-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
# Стили и скрипты КП и прототипа без версий: браузер сверяется с сервером.
location ~* \.(?:css|js)$ {
    include snippets/kp-alinaas-headers.conf;
    add_header Cache-Control "no-cache" always;
}
location ~* \.woff2$ {
    include snippets/kp-alinaas-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location ~* \.(?:webp|avif|jpe?g|png|gif|svg|ico)$ {
    include snippets/kp-alinaas-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
}
location = /reviews.json {
    include snippets/kp-alinaas-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
}
# Страницы всегда свежие (браузер проверяет по ETag и получает 304, если не менялись).
location / {
    try_files $uri $uri/ =404;
    include snippets/kp-alinaas-headers.conf;
    add_header Cache-Control "no-cache" always;
}
