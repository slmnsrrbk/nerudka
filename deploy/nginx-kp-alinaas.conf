# КП для mrs.alinaas: отдельный сайт на поддомене, прототип завода не трогает.
# Домен подставляет workflow deploy-kp-alinaas.yml вместо KP_DOMAIN.

server {
    listen 80;
    listen [::]:80;
    server_name KP_DOMAIN;

    root /var/www/kp-alinaas;
    index index.html;

    # Коммерческое предложение не должно попасть в поиск.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    gzip_min_length 1024;
}
