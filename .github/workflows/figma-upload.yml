# Отправляет скриншоты конкурентов в Figma по одноразовым ссылкам загрузки.
#
# Зачем раннер: егресс-политика контейнера разработки не пропускает
# mcp.figma.com (403 на CONNECT), а у раннера сеть открытая.
# Ссылки живут 10 минут и срабатывают один раз, поэтому workflow
# запускается сразу после их выдачи.
name: Upload screenshots to Figma

on:
  workflow_dispatch:
    inputs:
      map:
        description: 'JSON: [["competitors/файл.jpg","https://mcp.figma.com/..."], ...]'
        required: true

concurrency:
  group: figma-upload

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Загрузить файлы
        env:
          MAP: ${{ inputs.map }}
        run: |
          python3 - <<'PY' > pairs.tsv
          import json, os
          pairs = json.loads(os.environ['MAP'])
          for f, u in pairs:
              print(f + "\t" + u)
          PY
          ok=0; fail=0
          while IFS=$'\t' read -r f u; do
            if [ ! -f "$f" ]; then echo "НЕТ ФАЙЛА $f"; fail=$((fail+1)); continue; fi
            code=$(curl -sS -o resp.txt -w '%{http_code}' -m 180 -X POST "$u" -F "file=@$f;type=image/jpeg")
            if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "204" ]; then
              ok=$((ok+1)); echo "ok   $f"
            else
              fail=$((fail+1)); echo "FAIL $f -> $code $(head -c 300 resp.txt)"
            fi
          done < pairs.tsv
          echo "Загружено $ok, ошибок $fail"
          [ "$fail" -eq 0 ]
