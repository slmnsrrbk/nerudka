# Конфиг nginx для прототипа. Положить в /etc/nginx/sites-available/beton-prototype
# и включить: ln -s /etc/nginx/sites-available/beton-prototype /etc/nginx/sites-enabled/
#
# server_name замените на свой домен. Пока домена нет, можно оставить _
# и открывать сайт по IP.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/beton-prototype;
    index index.html;

    # Прототип не должен попасть в поиск.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Астро собирает страницы каталогами: /catalog/beton/ -> index.html внутри.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /404.html {
        internal;
    }
    error_page 404 /404.html;

    # Хешированные ассеты можно кешировать надолго, страницы нет.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/xml text/plain;
    gzip_min_length 1024;
}
