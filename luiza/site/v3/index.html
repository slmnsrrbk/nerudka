<!doctype html>
<html lang="ru" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Шаблон кейса Luiza, вариант 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Unbounded:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="v3.css">
</head>
<body>

<!-- Прототип шаблона страницы поста (Tilda CMS, Zero Block).
     Элементы с data-field связаны с полями потока и прячутся, если поле пустое
     (в Тильде: видимость «Указано»). Названия пунктов аккордеона статичные. -->

<div class="cursor" aria-hidden="true"><span>Смотреть</span></div>

<header class="nav">
  <a class="logo" href="#top" aria-label="Luiza Event"><img src="../logo.svg" width="204" height="27" alt="Luiza Event"></a>
  <nav class="menu">
    <a href="#" class="txt2">Портфолио</a>
    <a href="#" class="txt2">О нас</a>
    <a href="#" class="txt2">Новости</a>
    <a href="#" class="txt2">Контакты</a>
  </nav>
  <div class="nav__right">
    <a class="nav__phone" href="tel:+79297254467">+7 (929) 725-44-67</a>
    <a class="nav__cta" href="#">Записаться на встречу</a>
    <button class="nav__burger" type="button" aria-label="Меню"><span></span><span></span></button>
  </div>
</header>

<main id="top">

  <!-- 1. Первый экран: композиция как на текущем сайте -->
  <section class="hero">
    <div class="hero__glow" aria-hidden="true">
      <i class="g g1"></i><i class="g g2"></i><i class="g g3"></i><i class="g g4"></i>
      <i class="g g5"></i><i class="g g6"></i><i class="g g7"></i><i class="g g8"></i>
      <i class="g g-mouse"></i>
    </div>
    <div class="hero__line"></div>
    <div class="hero__grid">
      <div class="hero__meta">
        <span class="dot"></span>
        <span data-field="year" data-bind="year"></span>
      </div>
      <div class="hero__text">
        <h1 class="hero__title">
          <span data-field="title" data-bind="title"></span>
          <span class="hero__project" data-field="project_name" data-bind="project_name"></span>
        </h1>
        <p class="hero__lead" data-field="lead" data-bind="lead"></p>
      </div>
    </div>
    <figure class="hero__media" data-field="hero_img" data-view>
      <img data-bind="hero_img" alt="">
    </figure>
  </section>


  <section class="ov" data-field="concept_text">
    <div class="ov__main">
      <figure class="ph ph--full" data-field="concept_ph1" data-view><img data-bind="concept_ph1" alt=""></figure>
      <div class="ov__card ov__card--left">
        <span class="pill">Концепция</span>
        <p class="ov__text" data-bind="concept_text"></p>
      </div>
    </div>
    <div class="ov__row ov__row--1">
      <figure class="ph" data-field="concept_ph2" data-view><img data-bind="concept_ph2" alt=""></figure>
    </div>
  </section>

  <section class="ov" data-field="tasks_text">
    <div class="ov__main">
      <figure class="ph ph--full" data-field="tasks_ph1" data-view><img data-bind="tasks_ph1" alt=""></figure>
      <div class="ov__card ov__card--right">
        <span class="pill">Задачи</span>
        <p class="ov__text" data-bind="tasks_text"></p>
      </div>
    </div>
    <div class="ov__row ov__row--2">
      <figure class="ph" data-field="tasks_ph2" data-view><img data-bind="tasks_ph2" alt=""></figure><figure class="ph" data-field="tasks_ph3" data-view><img data-bind="tasks_ph3" alt=""></figure>
    </div>
  </section>

  <section class="wide"><figure class="ph ph--wide" data-field="wide_img" data-view><img data-bind="wide_img" alt=""></figure></section>

  <section class="ov" data-field="decor_text">
    <div class="ov__main">
      <figure class="ph ph--full" data-field="decor_ph1" data-view><img data-bind="decor_ph1" alt=""></figure>
      <div class="ov__card ov__card--left">
        <span class="pill">Декор</span>
        <p class="ov__text" data-bind="decor_text"></p>
      </div>
    </div>
    <div class="ov__row ov__row--2">
      <figure class="ph" data-field="decor_ph2" data-view><img data-bind="decor_ph2" alt=""></figure><figure class="ph" data-field="decor_ph3" data-view><img data-bind="decor_ph3" alt=""></figure>
    </div>
  </section>

  <section class="ov" data-field="extra_text">
    <div class="ov__main">
      <figure class="ph ph--full" data-field="extra_img" data-view><img data-bind="extra_img" alt=""></figure>
      <div class="ov__card ov__card--right">
        <span class="pill">Что было ещё</span>
        <ul class="ov__list" data-bind="extra_text" data-list></ul>
      </div>
    </div>
  </section>

  <!-- Галерея: оставшиеся фото плиткой -->
  <section class="tiles" data-field="gallery" data-bind="gallery"></section>
</main>

<nav class="variants" aria-label="Варианты страницы">
  <a href="../index.html">1</a><a href="../v2/index.html">2</a><a href="../v3/index.html" aria-current="page">3</a><a href="../v4/index.html">4</a>
</nav>

<!-- Просмотр фото на весь экран -->
<div class="lb" hidden role="dialog" aria-modal="true" aria-label="Просмотр фото">
  <div class="lb__stage"><img class="lb__img" alt=""></div>
  <button class="lb__btn lb__close" type="button" aria-label="Закрыть"></button>
  <button class="lb__btn lb__prev" type="button" aria-label="Предыдущее фото"></button>
  <button class="lb__btn lb__next" type="button" aria-label="Следующее фото"></button>
  <div class="lb__count"></div>
</div>

<script src="../case.js"></script>
<script src="../app.js"></script>
</body>
</html>
