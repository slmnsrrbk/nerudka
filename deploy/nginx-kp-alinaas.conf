# Сайт на поддомене КП, режим до выпуска сертификата (только HTTP).
# Домены подставляет workflow deploy-kp-alinaas.yml: KP_DOMAIN (свой поддомен)
# и SSLIP_DOMAIN (kp.<IP-через-дефисы>.sslip.io, работает без настройки DNS).
# Прототип завода и другие сайты на сервере не трогает.

server {
    listen 80;
    listen [::]:80;
    server_name KP_DOMAIN SSLIP_DOMAIN;
    include snippets/kp-alinaas.conf;
}
